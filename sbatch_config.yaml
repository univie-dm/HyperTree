# SBATCH configuration settings
# These are the SLURM directives for your jobs

job_name: hyperbolic_clustering
time: "0-16:00:00"
cpus: 32
mem: 32G
gres: "gpu:1"
constraint: "nvidia-h100|nvidia-h200"
output_dir: logs

# Environment setup commands (run before python script)
setup_commands:
  - "export PYTHON_VERSION=3.11"
  - "export ENV_NAME=hyper"
  - "export ENV_MODE=permanent"
  - "source /etc/profile.d/modules.sh"
  - "module load miniforge"
  - "export CUBLAS_WORKSPACE_CONFIG=:4096:8"

# Cleanup commands (run after python script)
cleanup_commands:
  - "module purge"
