## CIFAR-100 specific settings

defaults:
  - config
  - override dataset: cifar100
  - _self_

experiment:
  batch_size: 1024

architecture:
  projection_layer_dims: [512, 256, 128]
  latent_dim: 16

clustering:
  epochs: 300
  freeze_encoder: False
  hierarchical_loss:
    use_backbone_knn_similarities: False
    weight_interval: 250
    start_temperature: 0.2
    end_temperature: 0.1
    temperature_interval: 250

wandb:
  tags:
    - cifar100
