# @package _global_

defaults:
  - override /dataset: optdigits

dc_algorithm: 'idec'
cluster_loss_weight: 1.0
reconstruction_loss_weight: 0.1
clustering_epochs: 400
pretrain_epochs: 250
batch_size: 256
embedding_dim: 10
n_clusters: 10
pretrain_lr: 1e-3
clustering_lr: 1e-3
augmentation_invariance: true
num_workers: 8
seed: 400

log_interval: 2

brb:
  enabled: False
  reset_interval: 20
  reset_interpolation_factor: 0.9

wandb:
  enabled: False
  project: 'brb_new'

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      seed: 400, 148, 820, 214, 40, 805, 111, 491, 215, 513



