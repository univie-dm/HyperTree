## ImageNet DINO self-supervised pretraining (no labels)
## Goal: produce a strong pretrained backbone for transfer to CUB-200,
## directly comparable to imagenet_simclr.yaml.
## Architecture MUST match cub200_dino_transfer.yaml for weight loading.
## Stage-2 clustering on ImageNet itself is intentionally minimal — we only
## want the saved pretrained weights at data/models/<hash>.pt.

architecture:
  model_type: resnet50
  latent_dim: 512
  feature_scaling: True
  projection_layer_dims: [1024, 512]
  precision: float32
  manifold_precision: float32   # FP64 on H100 is ~64x slower than FP32; multi-crop calls the hyperbolic head 8x per sample, so this is the dominant cost
  manifold_name: PoincareBall
  curvature_magnitude: 1.0
  hyperbolic_encoding: HyperbolicLinearPP
  activation_function: swish
  hyperbolic_clamping: 1.0
  hyperbolic_smoothing: 50.0
  hyperboloid_layer_learnable_scale: True
  FHCNN_normalize: True
  hyperbolic_decoding: Log_EuclideanLinear
  feedforward_hidden_dims: [512, 256, 128]

pretraining:
  method: dino
  augmentation: dino   # multi-crop (2 global + n_local_crops local)
  epochs: 100
  overwrite: False
  learning_rate: 5.0e-4
  weight_decay: 0.04
  accumulate_gradients: 1   # effective batch = 256/GPU * 4 GPUs * 1 accum = 1024
  enable_checkpointing: True   # important — restartable across SLURM jobs
  load_supervised_weights: False
  supervised: False
  # Multi-crop settings
  n_local_crops: 6
  local_crop_size: 96
  contrastive_loss:
    enabled: True
    weight: 0.5
    temperature: 0.2
  reconstruction_loss:
    weight: 0.0
  lr_scheduler:
    type: warmup_cosine
    interval: 10            # warmup epochs
    cosine_min_factor: 0.001
    patience: 20
  dino:
    out_dim: 65536
    hidden_dim: 2048
    bottleneck_dim: 256
    teacher_momentum_start: 0.996
    teacher_momentum_end: 1.0
    teacher_temperature: 0.04
    student_temperature: 0.1
    center_momentum: 0.9
    warmup_teacher_temp: 0.04
    warmup_teacher_temp_epochs: 30

clustering:
  # Minimal — we only need pretrained weights to be saved.
  epochs: 2
  learning_rate: 1.0e-4
  weight_decay: 1.0e-5
  enable_checkpointing: False
  accumulate_gradients: 1
  freeze_encoder: True
  unfreeze_backbone_from: null
  backbone_lr_factor: 0.1
  lr_scheduler:
    type: warmup_cosine
    interval: 1
    cosine_min_factor: 0.01
    patience: 20
  hyperbolic_loss:
    start_weight: 1.0
    end_weight: 1.0
    weight_interval: 1
    start_temperature: 0.2
    end_temperature: 0.2
    temperature_interval: 1
    lca_version: ours
    loss_version: normalized
    sampling_strategy: importance
    sampling_eps: 0.01
    sampling_delta: 0.01
    sampling_alpha: 0.2
    uniform_sample_size: 10000
    log_approximation_diff: False
    use_backbone_knn_similarities: True
    snn_k: 10
    similarity_pruning:
      version: null
      threshold: 0.01
      quantile: 0.2
      nearest_neighbors: 10
  contrastive_loss:
    enabled: True
    temperature: 0.5
    weight: 0.1
  reconstruction_loss:
    weight: 0.0
  regularizer:
    enabled: False
    weight: 0.05

experiment:
  seed: 42
  num_workers: 12        # 12/rank * 4 ranks = 48 workers + 4 main procs; leaves headroom on 64 CPUs (16/rank caused contention)
  training_precision: bf16-mixed   # H100 BF16 tensor cores; manifold ops are protected by self._2manifold_dtype which casts back to FP32 inside expmap/logmap
  batch_size: 256        # per-GPU; halves step count vs 128, fits 80G H100 with multi-crop
  log_interval: 10
  optimizer: Adam
  gradient_clip_value: 5.0

evaluation_metrics:
  delta_hyperbolicity: False
  dendrogram_purity_single: False
  dendrogram_purity_complete: False
  dendrogram_purity_average: False
  dendrogram_purity_ward: False
  dendrogrampurity_use_root: True
  agglomerative_clustering_single: False
  agglomerative_clustering_complete: False
  agglomerative_clustering_average: False
  agglomerative_clustering_ward: False
  nearest_neighbors_accuracy: True
  spectral_clustering: False
  visualization: False
  kmeans: False
  best_partition_complete: False
  best_partition_average: False
  best_partition_ward: False
  best_partition_max_k: null
  dasgupta_cost: False
  visualization_sample_size: 5000
  test_sample_size: 10000   # subsample for speed — pretrain weights are the goal
  results_dir: './results'
  use_wordnet_labels: True
  wordnet_hierarchy_path: './data/cifar100_wordnet_hierarchy.txt'
  imagenet_hierarchy_path: './data/imagenet_wordnet_hierarchy.txt'
  wordnet_download_if_missing: True

wandb:
  enabled: True
  project: hyper_clustering
  entity: kevin-sidak-team
  save_dir: ./logs
  tags:
    - imagenet
    - dino
    - unsupervised
    - pretrain

hydra:
  run:
    dir: ${wandb.save_dir}/hydra/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: ${wandb.save_dir}/hydra/${now:%Y-%m-%d_%H-%M-%S}
  output_subdir: null
  job:
    chdir: False

defaults:
  - _self_
  - dataset: imagenet
  - override hydra/job_logging: disabled
