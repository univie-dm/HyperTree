# Training parameters
seed: 400
num_workers: 8
batch_size: 512
overwrite: False
learning_rate: 3e-3
## Pretraining parameters
pretrain_epochs: 400
pretrain_trainable_curvature: False
## Clustering parameters
clustering_epochs: 500
clustering_model: 'HyperbolicHC' # 'HyperbolicHC', 'HyperbolicContrastive'
clustering_trainable_curvature: False
### Contrastive parameters
contrastive_weight: 1.0
contrastive_temperature: 0.05
light_radius: 0.1
### HypHC parameters
hyphc_weight: 0.0001
hyphc_temperature: 0.05
hyphc_sampling_strategy: 'all_subsample_triplets' # 'all_subsample_triplets', 'random', 'chami'
hyphc_triplet_subsampling_size: 100

# Model architecture
ae_type: 'feedforward' # 'feedforward', 'resnet18', 'resnet34'
hidden_dims: [512, 256, 128, 64, 32]
embedding_dim: 10
manifold_name: 'PoincareBall' # 'Euclidean', 'Hyperboloid', 'PoincareBall'
curvature_magnitude: 1.0

# Logging
log_interval: 5
wandb:
  enabled: True
  project: 'hyper_clustering'
  entity: 'kevin-sidak-team'
  save_dir: './logs'
  plot_label_type: 'class'
  tags: []

hydra:
  run:
    dir: ${wandb.save_dir}/hydra/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: ${wandb.save_dir}/hydra/${now:%Y-%m-%d_%H-%M-%S}
  output_subdir: null
  job:
    chdir: False

defaults:
  - _self_
  - dataset: ${oc.select:dataset,mnist}
