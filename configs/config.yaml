# Training parameters
seed: 400
pretrain_epochs: 10
clustering_epochs: 20
embedding_dim: 2

# Model architecture
hidden_dims: [512, 256, 128, 64, 32]
learning_rate: 1e-3
triplet_loss_weight: 1.0
magnitude_curvature: 1.0

num_workers: 4
batch_size: 512

# Logging
log_interval: 2
wandb:
  enabled: true
  project: 'hyper_clustering'
  entity: 'kevin-sidak-team'
  save_dir: './logs'

hydra:
  run:
    dir: ${wandb.save_dir}/hydra/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: ${wandb.save_dir}/hydra/${now:%Y-%m-%d_%H-%M-%S}
  output_subdir: null
  job:
    chdir: false
    
defaults:
  - _self_
  - dataset: ${oc.select:dataset,mnist}

