## Training parameters
experiment:
  seed: 400
  num_workers: 8
  batch_size: 512
  log_interval: 10
  optimizer: 'RiemannianAdam' # 'RiemannianAdam', 'RiemannianSGD'

## Pretraining parameters
pretraining:
  epochs: 400
  learning_rate: 3e-3
  trainable_curvature: False
  overwrite: False

## Clustering parameters
clustering:
  epochs: 500
  trainable_curvature: False
  accumulate_gradients: 1000
  learning_rate: 1e-3
  # Learning rate scheduler
  lr_scheduler:
    type: # 'cosine', 'linear', 'warmup_cosine'
    warmup_epochs: 100  # Number of epochs for warmup phase
    warmup_factor: 0.1  # Initial learning rate factor (0.1 means start at 10% of target lr)
    cosine_min_factor: 0.01  # Minimum learning rate factor for cosine annealing
    cosine_cycles: 1  # Number of cosine cycles
  # Contrastive loss parameters
  use_contrastive_loss: False # Whether to use contrastive loss during clustering
  contrastive_weight: 1.0 # Weight for contrastive loss when used with reconstruction
  contrastive_temperature: 0.05 # Temperature for contrastive loss
  contrastive_projection_dim: 128 # Dimension of the projection head for contrastive loss

## HypHC parameters
hyphc:
  loss_weight: 1.0
  temperature: 0.05
  sampling_strategy: 'all_subsample_triplets' # 'all_subsample_triplets', 'chami'
  triplet_subsampling_size: 150
  lca_version: 'ours' # 'ours', 'chami'
  normalized_loss: True
  distances_type: 'geodesic' # 'geodesic', 'cosine_similarity'
  dist_sum_loss: True

## Model architecture
architecture:
  ae_type: 'feedforward' # 'feedforward', 'resnet18', 'resnet34', 'resnet50'
  hidden_dims: [512, 256, 128, 64, 32]
  latent_dim: 10
  hyperbolic_encoding: 'EuclideanLinear_Exp' # 'EuclideanLinear_Exp', 'HyperbolicLinear', 'HyperbolicLinearPP'
  hyperbolic_decoding: 'Log_EuclideanLinear' # 'Log_EuclideanLinear', 'HyperbolicLinear_Log', 'HyperbolicLinearPP_Log',
                                             # 'HyperbolicRegression', 'HyperbolicRegressionPP'
  precision: 'float64' # 'float32', 'float64'
  manifold_name: 'PoincareBall' # 'Euclidean', 'Hyperboloid', 'PoincareBall'
  manifold_precision: 'float64' # 'float16', 'float32', 'float64'
  curvature_magnitude: 1.0

## Logging
wandb:
  enabled: True
  project: 'hyper_clustering'
  entity: 'kevin-sidak-team'
  save_dir: './logs'
  tags: []

## Hydra specifics
hydra:
  run:
    dir: ${wandb.save_dir}/hydra/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: ${wandb.save_dir}/hydra/${now:%Y-%m-%d_%H-%M-%S}
  output_subdir: null
  job:
    chdir: False

defaults:
  - _self_
  - dataset: ${oc.select:dataset,mnist}
