# Shared settings of the paper recipes. The dataset configs (cifar100, tiny_imagenet, imagenet, inat18) load this
# file and set the dataset-specific values (batch size, backbone and pretraining, projection head, embedding
# dimension, joint-training schedule, frozen backbone, evaluation subsample). Loaded on its own, it runs CIFAR-100
# with the CIFAR-100 recipe (configs/cifar100.yaml).

## Training parameters
experiment:
  seed: 1
  num_workers: 16
  batch_size: 1024
  log_interval: 10
  optimizer: 'Adam' # 'Adam', 'SGD'
  gradient_clip_value: 5.0 # None, Float
  training_precision: '32-true' # Lightning precision of the pretraining stage only: '32-true', 'bf16-mixed', '16-mixed'
  cudnn_benchmark: True  # let cuDNN pick the fastest convolution algorithm per input shape (not bitwise reproducible)
  deterministic: False  # Lightning Trainer(deterministic=...): deterministic algorithms only (slower)


## Pretraining parameters (SimCLR on the projection-head features of two augmented views)
pretraining:
  epochs: 800 # 0 skips pretraining (e.g. together with pretrained_weights)
  overwrite: False
  learning_rate: 0.003
  weight_decay: 1e-5
  accumulate_gradients: 1  # Gradient accumulation steps (effective_batch = batch_size * accumulate_gradients * num_gpus)
  enable_checkpointing: True  # resume an interrupted pretraining from <paths.checkpoints_dir>/pretrain_<hash>/
  checkpoint_interval: 50  # epochs between pretraining checkpoints
  # Contrastive loss parameters
  contrastive_loss:
    temperature: 0.5
    # 'euclidean': SimCLR, cosine similarity of the projection-head features (before the hyperbolic layer);
    #              feature scaling and the hyperbolic layer stay untrained until the clustering stage.
    # 'hyperbolic': negative geodesic distance of the manifold embeddings (after the hyperbolic layer),
    #              i.e. the contrastive loss of the clustering stage; trains the whole model.
    space: 'euclidean' # 'euclidean', 'hyperbolic'
  # Learning rate scheduler
  lr_scheduler:
    type: warmup_cosine  # 'warmup_cosine', 'ReduceLROnPlateau'
    interval: 40  # Number of epochs for warmup phase (also T_0 for cosine restart)
    cosine_min_factor: 0.01  # Minimum learning rate factor for cosine annealing
    patience: 20 # ReduceLROnPlateau: number of epochs without improvement before the lr is reduced
    factor: 0.1 # ReduceLROnPlateau: factor the lr is multiplied with
  # External backbone checkpoint, a local path or a URL (downloaded to paths.models_dir on first use), e.g. the
  # DINO ResNet-50 of the ImageNet-1k recipe. The backbone is then kept frozen.
  pretrained_weights: null


## Clustering parameters
clustering:
  epochs: 300
  learning_rate: 1e-4  # constant
  weight_decay: 1e-5
  accumulate_gradients: 1
  freeze_encoder: False  # Freeze the encoder (backbone and projection head) during clustering (recommended with use_backbone_knn_similarities)
  train_projection_head: True  # Only with freeze_encoder: keep the projection head trainable, so that only the backbone is frozen and the
                                # head is trained jointly with the feature scaling and the hyperbolic layer
  # Save a checkpoint every checkpoint_interval epochs to <paths.checkpoints_dir>/clustering_<hash of the config>/ and
  # resume from it when the same configuration is started again (e.g. after a Slurm preemption or time limit),
  # continuing the W&B run. The checkpoint is kept after the run; delete the directory to rerun the same configuration.
  # Independently of this, the final model is always saved to <paths.final_models_dir>/<same hash>.pt.
  enable_checkpointing: True
  checkpoint_interval: 5
  # Hierarchical loss parameters (computed on the first augmented view of each image)
  hierarchical_loss:
    start_weight: 1.0
    end_weight: 5.0
    weight_interval: 250 # 0 equals to end_weight all times
    start_temperature: 0.2
    end_temperature: 0.1
    temperature_interval: 250 # 0 equals to end_temperature all times
    lca_version: 'rectified' # 'rectified', 'unrectified' (LCA on the full geodesic instead of the geodesic segment)
    # Importance sampling of triplets: sample size m >= (1/2 + 2/3 eps) * ln(2 / delta) / eps^2.
    # Batches with fewer triplets than m are evaluated exactly.
    sampling_eps: 0.01 # accuracy of sampling
    sampling_delta: 0.01 # confidence of sampling
    # Backbone kNN SNN similarities: replace hyperbolic-distance similarities with Jaccard SNN
    # in backbone feature space (higher-dim, richer semantic signal). Pair with freeze_encoder: true.
    # The features are taken after the projection head, so with train_projection_head they change during training.
    use_backbone_knn_similarities: False
    snn_k: 10 # number of nearest neighbors for SNN computation
  # Contrastive loss parameters (positive pair: the two augmented views of each image)
  # enabled: False trains with the hierarchical loss only (hierarchical_loss.start_weight/end_weight 0: contrastive only)
  contrastive_loss:
    enabled: True
    temperature: 0.5
    weight: 0.1


## Model architecture
architecture:
  model_type: 'resnet50' # 'resnet18', 'resnet34', 'resnet50', 'resnet101', 'resnet152', 'bioclip' (frozen, requires open_clip_torch)
  projection_layer_dims: [1024, 512, 256, 128] # contrastive projection head layers after encoder
  latent_dim: 16 # embedding manifold dimension (Hyperboloid implements latent_dim+1)
  precision: 'float32' # 'float32', 'float64'
  manifold_precision: 'float64' # 'float32', 'float64'
  manifold_name: 'PoincareBall' # 'Euclidean', 'Hyperboloid', 'PoincareBall'
  curvature_magnitude: 1.0 # sectional curvature magnitude of the hyperbolic manifold
  hyperbolic_encoding: 'HyperbolicLinearPP' # HNN++ fully connected layer (Poincare ball and Hyperboloid)
  activation_function: 'swish' # 'swish', 'relu'
  feature_scaling: True # bound the norms of the Euclidean features before the hyperbolic layer


## Evaluation Metrics to be used and logged
evaluation_metrics:
  # (Hierarchical) dendrogram purity per tree decoder: linkage on the geodesic distances, or the
  # LCA-induced tree (single linkage on the rectified-LCA depths, hyperbolic manifolds only)
  dendrogram_purity_single: True
  dendrogram_purity_complete: True
  dendrogram_purity_average: True
  dendrogram_purity_ward: True
  dendrogram_purity_lca: True
  # Every purity is logged twice: "_with_root" counts the root merge (the final merge of the dendrogram and, for the
  # hierarchical purity, the root cluster of all classes), "_no_root" does not. Both come from the same computation.
  # NMI against the fine labels of the flat clustering obtained by cutting the dendrogram of each linkage over the
  # geodesic distances (the same tree as for the dendrogram purity) into as many clusters as there are classes
  agglomerative_clustering_single: False
  agglomerative_clustering_complete: False
  agglomerative_clustering_average: False
  agglomerative_clustering_ward: True
  nearest_neighbors_accuracy: True
  recall_at_k: True
  test_sample_size: 0 # class-stratified subsample of the test split (the same in every evaluation); 0 = all points
  results_dir: './results' # metrics of every evaluation are also written here as JSON
  # Class hierarchies for hierarchical evaluation (WordNet for CIFAR-100 / TinyImageNet / ImageNet, taxonomy for iNat18)
  use_wordnet_labels: True  # Use the class hierarchy for hierarchical DP evaluation
  wordnet_hierarchy_path: './data/cifar100_wordnet_hierarchy.txt'  # CIFAR-100 hierarchy file
  tiny_imagenet_hierarchy_path: './data/tiny_imagenet_wordnet_hierarchy.txt'  # TinyImageNet hierarchy file (built from the dataset folder)
  imagenet_hierarchy_path: './data/imagenet_wordnet_hierarchy.txt'  # ImageNet hierarchy file (auto-downloaded from cvjena/semantic-embeddings)
  inat18_hierarchy_path: './data/inat18_taxonomy_hierarchy.txt'  # iNat18 taxonomy file
  wordnet_download_if_missing: True  # Automatically download/setup hierarchy files if not found


## Output locations (relative to the working directory). They do not enter the cache and checkpoint hashes.
paths:
  models_dir: ./data/models  # models at the end of pretraining (cache keyed by the pretraining settings), downloaded backbones
  checkpoints_dir: ./data/checkpoints  # pretraining and clustering checkpoints
  final_models_dir: ./data/final_models  # model and config after the last clustering epoch


## Logging
wandb:
  enabled: True
  project: 'hypertree'
  entity: null  # W&B team or user; null = your default entity
  save_dir: './logs'
  tags:
    - cifar100


## Hydra specifics
hydra:
  run:
    dir: ${wandb.save_dir}/hydra/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: ${wandb.save_dir}/hydra/${now:%Y-%m-%d_%H-%M-%S}
  output_subdir: null
  job:
    chdir: False

defaults:
  - _self_
  - dataset: ${oc.select:dataset,cifar100}
  - override hydra/job_logging: disabled
