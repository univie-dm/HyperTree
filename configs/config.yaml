## Training parameters
experiment:
  seed: 1
  num_workers: 20
  batch_size: 512
  log_interval: 10
  optimizer: 'Adam' # 'Adam', 'SGD'
  gradient_clip_value: 5.0 # None, Float


## Pretraining parameters
pretraining:
  epochs: 800
  overwrite: False
  learning_rate: 0.003
  weight_decay: 1e-5
  enable_checkpointing: False  # Enable for long training runs (e.g., ImageNet)
  # Reconstruction loss parameters
  reconstruction_loss:
    weight: 0.0
  # Contrastive loss parameters
  contrastive_loss:
    enabled: True
    weight: 1.0
    temperature: 0.5
  # Learning rate scheduler
  lr_scheduler:
    type: # 'warmup_cosine', 'ReduceLROnPlateau'
    interval: 40  # Number of epochs for warmup phase
    cosine_min_factor: 0.01  # Minimum learning rate factor for cosine annealing
    patience: 20 # Number of epochs
  load_supervised_weights: False
  supervised: False


## Clustering parameters
clustering:
  epochs: 600
  learning_rate: 1e-4
  weight_decay: 1e-5
  enable_checkpointing: False  # Enable for long training runs
  accumulate_gradients: 1
  # Learning rate scheduler
  lr_scheduler:
    type: # 'warmup_cosine'
    interval: 40  # Number of epochs for warmup phase
    cosine_min_factor: 0.01  # Minimum learning rate factor for cosine annealing
    patience: 20 # Number of epochs
  # Hyperbolic loss parameters
  hyperbolic_loss:
    start_weight: 1.0
    end_weight: 3.0
    weight_interval: 300 # 0 equals to end_weight all times
    start_temperature: 0.2
    end_temperature: 0.1
    temperature_interval: 250 # 0 equals to end_temperature all times
    lca_version: 'ours' # 'ours', 'chami'
    loss_version: 'normalized' # 'wang', 'normalized', 'chami' (chami & wang requires use_importance_sampling=False)
    sampling_strategy: 'importance' # None/'None', 'uniform', 'importance', 'power_weighted'
    sampling_eps: 0.001 # accuracy of sampling
    sampling_delta: 0.01 # confidence of sampling
    sampling_alpha: 0.5 # interpolation factor between uniform-importance sampling
    uniform_sample_size: 1000
    log_approximation_diff: False # log the approximation quality when using sampling
  # Contrastive loss parameters
  contrastive_loss:
    enabled: True
    temperature: 0.5
    weight: 0.1
  # Reconstruction loss parameters
  reconstruction_loss:
    weight: 0.0
  # Regularizer parameters (regularization to the origin)
  regularizer:
    enabled: False
    weight: 0.05


## Model architecture
architecture:
  model_type: 'resnet50' # 'feedforward', 'resnet18', 'resnet34', 'resnet50', 'resnet101', 'resnet152'
  feature_scaling: True
  feedforward_hidden_dims: [512, 256, 128] # only used if model_type is 'feedforward'
  projection_layer_dims: [512, 256, 128] # contrastive projection head layers after encoder
  latent_dim: 32 # Hyperboloid automatically uses latent_dim+1 (latent_dim refers to the dimension of the hyperbolic manifold)
  precision: 'float32' # 'float32', 'float64'
  manifold_precision: 'float64' # 'float32', 'float64'
  manifold_name: 'PoincareBall' # 'Euclidean', 'Hyperboloid', 'PoincareBall'
  curvature_magnitude: 1.0
  hyperbolic_encoding: 'HyperbolicLinearPP' # 'EuclideanLinear_Exp'
                                            #  Hyperboloid: 'HyperbolicLinearHyperboloidFHNN', 'HyperbolicLinearHyperboloidFHCNN', 'HyperbolicLinearPP'
                                            #  Poincare: 'HyperbolicLinearPP'
  hyperbolic_decoding: 'Log_EuclideanLinear' # 'Log_EuclideanLinear'
                                             # Hyperboloid: 'HyperbolicLinearHyperboloidFHNN_Log', 'HyperbolicLinearHyperboloidFHCNN_Log', 'HyperbolicLinearPP_Log'
                                             # Poincare: 'HyperbolicLinearPP_Log'
  activation_function: 'swish' # 'swish', 'relu'
  hyperbolic_clamping: 1.0
  hyperbolic_smoothing: 50.0
  hyperboloid_layer_learnable_scale: False # only used in Hyperboloid layers
  FHCNN_normalize: False # only used if hyperbolic_encoding is 'HyperbolicLinearHyperboloidFHCNN'


## Evaluation Metrics to be used and logged
evaluation_metrics:
  delta_hyperbolicity: False
  dendrogram_purity_single: False
  dendrogram_purity_complete: True
  dendrogram_purity_average: False
  dendrogram_purity_ward: True
  dendrogrampurity_use_root: True  # if True, the root node (final dendrogram merge) is included in the purity sum
  agglomerative_clustering_single: False
  agglomerative_clustering_complete: True
  agglomerative_clustering_average: False
  agglomerative_clustering_ward: True
  nearest_neighbors_accuracy: True
  spectral_clustering: True
  visualization: True
  kmeans: False
  dasgupta_cost: False
  visualization_sample_size: 5000
  test_sample_size: 0 # if 0 all datapoints are used
  # WordNet hierarchy for hierarchical evaluation (CIFAR-100 and ImageNet)
  use_wordnet_labels: True  # Use WordNet hierarchy for hierarchical DP evaluation
  wordnet_hierarchy_path: './data/cifar100_wordnet_hierarchy.txt'  # CIFAR-100 hierarchy file
  imagenet_hierarchy_path: './data/imagenet_wordnet_hierarchy.txt'  # ImageNet hierarchy file (auto-downloaded from cvjena/semantic-embeddings)
  wordnet_download_if_missing: True  # Automatically download/setup hierarchy files if not found


## Logging
wandb:
  enabled: True
  project: 'hyper_clustering'
  entity: 'kevin-sidak-team'
  save_dir: './logs'
  tags:
    - test


## Hydra specifics
hydra:
  run:
    dir: ${wandb.save_dir}/hydra/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: ${wandb.save_dir}/hydra/${now:%Y-%m-%d_%H-%M-%S}
  output_subdir: null
  job:
    chdir: False

defaults:
  - _self_
  - dataset: ${oc.select:dataset,cifar100}
  - override hydra/job_logging: disabled
