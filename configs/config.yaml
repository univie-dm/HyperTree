## Training parameters
experiment:
  seed: 1
  num_workers: 20
  batch_size: 512
  log_interval: 10
  optimizer: 'Adam' # 'Adam', 'SGD'
  gradient_clip_value: 5.0 # None, Float
  training_precision: '32-true' # Lightning autocast, PRETRAINING stage only. '32-true', 'bf16-mixed', '16-mixed'.
                                # bf16-mixed cuts pretraining memory; manifold ops stay FP32 via _2manifold_dtype.


## Pretraining parameters (SimCLR on the backbone features with two augmented views)
pretraining:
  epochs: 800 # 0 skips pretraining (e.g. together with pretrained_weights_path)
  overwrite: False
  learning_rate: 0.003
  weight_decay: 1e-5
  accumulate_gradients: 1  # Gradient accumulation steps (effective_batch = batch_size * accumulate_gradients * num_gpus)
  enable_checkpointing: False  # Enable for long training runs (e.g., ImageNet)
  # Contrastive loss parameters
  contrastive_loss:
    temperature: 0.5
  # Learning rate scheduler
  lr_scheduler:
    type: warmup_cosine  # 'warmup_cosine', 'ReduceLROnPlateau'
    interval: 40  # Number of epochs for warmup phase (also T_0 for cosine restart)
    cosine_min_factor: 0.01  # Minimum learning rate factor for cosine annealing
    patience: 20 # Number of epochs
  pretrained_weights_path: null  # Path to an external backbone checkpoint (e.g. FB DINO ResNet50); the backbone is then kept frozen


## Clustering parameters
clustering:
  epochs: 600
  learning_rate: 1e-4
  weight_decay: 1e-5
  accumulate_gradients: 1
  freeze_encoder: True  # Freeze the encoder (backbone and projection head) during clustering (recommended with use_backbone_knn_similarities)
  train_projection_head: False  # Only with freeze_encoder: keep the projection head trainable, so that only the backbone is frozen and the
                                # head is trained jointly with the feature scaling and the hyperbolic layer
  # Learning rate scheduler
  lr_scheduler:
    type: # 'warmup_cosine'
    interval: 40  # Number of epochs for warmup phase
    cosine_min_factor: 0.01  # Minimum learning rate factor for cosine annealing
    patience: 20 # Number of epochs
  # Hierarchical loss parameters
  hierarchical_loss:
    start_weight: 1.0
    end_weight: 5.0
    weight_interval: 250 # 0 equals to end_weight all times
    start_temperature: 0.2
    end_temperature: 0.1
    temperature_interval: 250 # 0 equals to end_temperature all times
    # Images the hierarchical loss is computed on: 'original' (un-augmented) or 'augmented' (first
    # augmented view). Only the views that are needed are prepared by the dataloader and encoded
    # (once per step). The pairwise distances of the contrastive loss are reused for the similarities /
    # triplet sampling whenever this view is part of the contrastive positive pair: always for
    # 'augmented', for 'original' only with 'orig_aug'.
    view: 'original' # 'original', 'augmented'
    lca_version: 'rectified' # 'rectified', 'unrectified' (LCA on the full geodesic instead of the geodesic segment)
    # Importance sampling of triplets: sample size m >= (1/2 + 2/3 eps) * ln(2 / delta) / eps^2.
    # Batches with fewer triplets than m are evaluated exactly.
    sampling_eps: 0.01 # accuracy of sampling
    sampling_delta: 0.01 # confidence of sampling
    # Backbone kNN SNN similarities: replace hyperbolic-distance similarities with Jaccard SNN
    # in backbone feature space (higher-dim, richer semantic signal). Pair with freeze_encoder: true.
    # The features are taken after the projection head, so with train_projection_head they change during training.
    use_backbone_knn_similarities: True
    snn_k: 10 # number of nearest neighbors for SNN computation
  # Contrastive loss parameters
  # For end-to-end unsupervised: enable this and set pretraining.epochs=0, freeze_encoder=False,
  # hierarchical_loss.start_weight=0.0, end_weight=1.0, weight_interval=<warmup_epochs>.
  contrastive_loss:
    enabled: True
    temperature: 0.5
    weight: 0.1
    # Positive pair: 'aug_aug' (aug_1, aug_2) or 'orig_aug' (original, aug_1).
    positive_pair: 'aug_aug' # 'aug_aug', 'orig_aug'


## Model architecture
architecture:
  model_type: 'resnet50' # 'resnet18', 'resnet34', 'resnet50', 'resnet101', 'resnet152', 'bioclip' (frozen, requires open_clip_torch)
  projection_layer_dims: [1024, 512] # contrastive projection head layers after encoder
  latent_dim: 32 # embedding manifold dimension (Hyperboloid implements latent_dim+1)
  precision: 'float32' # 'float32', 'float64'
  manifold_precision: 'float64' # 'float32', 'float64'
  manifold_name: 'PoincareBall' # 'Euclidean', 'Hyperboloid', 'PoincareBall'
  curvature_magnitude: 1.0 # sectional curvature magnitude of the hyperbolic manifold
  hyperbolic_encoding: 'HyperbolicLinearPP' #  Hyperboloid: 'HyperbolicLinearPP', 'HyperbolicLinearHyperboloidFHNN', 'HyperbolicLinearHyperboloidFHCNN'
                                            #  Poincare: 'HyperbolicLinearPP'
  activation_function: 'swish' # 'swish', 'relu'
  feature_scaling: True # bound the norms of the Euclidean features before the hyperbolic layer


## Evaluation Metrics to be used and logged
evaluation_metrics:
  # (Hierarchical) dendrogram purity per tree decoder: linkage on the geodesic distances, or the
  # LCA-induced tree (single linkage on the rectified-LCA depths, hyperbolic manifolds only)
  dendrogram_purity_single: False
  dendrogram_purity_complete: True
  dendrogram_purity_average: False
  dendrogram_purity_ward: True
  dendrogram_purity_lca: True
  dendrogrampurity_use_root: True  # if True, the root node (final dendrogram merge) is included in the purity sum
  # NMI of agglomerative clustering
  agglomerative_clustering_single: False
  agglomerative_clustering_complete: True
  agglomerative_clustering_average: False
  agglomerative_clustering_ward: True
  nearest_neighbors_accuracy: True
  recall_at_k: True
  test_sample_size: 0 # if 0 all datapoints are used
  results_dir: './results' # metrics of every evaluation are also written here as JSON
  # Class hierarchies for hierarchical evaluation (WordNet for CIFAR-100 / TinyImageNet / ImageNet, taxonomy for iNat18)
  use_wordnet_labels: True  # Use the class hierarchy for hierarchical DP evaluation
  wordnet_hierarchy_path: './data/cifar100_wordnet_hierarchy.txt'  # CIFAR-100 hierarchy file
  tiny_imagenet_hierarchy_path: './data/tiny_imagenet_wordnet_hierarchy.txt'  # TinyImageNet hierarchy file (built from the dataset folder)
  imagenet_hierarchy_path: './data/imagenet_wordnet_hierarchy.txt'  # ImageNet hierarchy file (auto-downloaded from cvjena/semantic-embeddings)
  inat18_hierarchy_path: './data/inat18_taxonomy_hierarchy.txt'  # iNat18 taxonomy file
  wordnet_download_if_missing: True  # Automatically download/setup hierarchy files if not found


## Logging
wandb:
  enabled: True
  project: 'hypertree'
  entity: 'thomas-lang'
  save_dir: './logs'
  tags:
    - cifar100


## Hydra specifics
hydra:
  run:
    dir: ${wandb.save_dir}/hydra/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: ${wandb.save_dir}/hydra/${now:%Y-%m-%d_%H-%M-%S}
  output_subdir: null
  job:
    chdir: False

defaults:
  - _self_
  - dataset: ${oc.select:dataset,cifar100}
  - override hydra/job_logging: disabled
