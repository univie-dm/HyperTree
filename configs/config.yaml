# Training parameters
seed: 400
pretrain_epochs: 200
clustering_epochs: 200
embedding_dim: 100

# Model architecture
ae_type: 'resnet'
hidden_dims: [512, 256, 128, 64, 32]
learning_rate: 1e-3
triplet_loss_weight: 1.0
magnitude_curvature: 1.0
triplet_sampled_n: 1e4
loss_batch_size: 1e4

num_workers: 8
batch_size: 256

# Logging
log_interval: 10
wandb:
  enabled: true
  project: 'hyper_clustering'
  entity: 'kevin-sidak-team'
  save_dir: './logs'
  plot_label_type: 'class'
  tags: []

hydra:
  run:
    dir: ${wandb.save_dir}/hydra/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: ${wandb.save_dir}/hydra/${now:%Y-%m-%d_%H-%M-%S}
  output_subdir: null
  job:
    chdir: false
    
defaults:
  - _self_
  - dataset: ${oc.select:dataset,mnist}

