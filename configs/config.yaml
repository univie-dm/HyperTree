# Training parameters
seed: 400
pretrain_epochs: 1000
clustering_epochs: 1000
embedding_dim: 10

# Model architecture
ae_type: 'resnet34'
hidden_dims: [512, 256, 128, 64, 32]
learning_rate: 1e-3
triplet_loss_weight: 1.0
magnitude_curvature: 3.0
trainable_curvature: true
triplet_sampled_n: 1e4
loss_batch_size: 1e4
temperature: 0.1
light_radius: 0.1
contrastive_weight: 1.0
save_model: true
overwrite: false


num_workers: 8
batch_size: 512

# Logging
log_interval: 5
wandb:
  enabled: true
  project: 'hyper_clustering'
  entity: 'kevin-sidak-team'
  save_dir: './logs'
  plot_label_type: 'class'
  tags: []

hydra:
  run:
    dir: ${wandb.save_dir}/hydra/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: ${wandb.save_dir}/hydra/${now:%Y-%m-%d_%H-%M-%S}
  output_subdir: null
  job:
    chdir: false
    
defaults:
  - _self_
  - dataset: ${oc.select:dataset,cifar10}

