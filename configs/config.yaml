## Training parameters
experiment:
  seed: 400
  num_workers: 8
  batch_size: 512
  log_interval: 10
  optimizer: 'RiemannianAdam' # 'RiemannianAdam', 'RiemannianSGD'
  gradient_clip_value: 1.0 # None, Float

## Pretraining parameters
pretraining:
  epochs: 10
  learning_rate: 3e-3
  trainable_curvature: False
  overwrite: False
  weight_decay: 0.0
  augmentations: False

## Clustering parameters
clustering:
  epochs: 20
  trainable_curvature: False
  accumulate_gradients: 1
  learning_rate: 1e-3
  weight_decay: 0.0
  augmentations: False
  # Learning rate scheduler
  lr_scheduler:
    type: # 'warmup_cosine'
    interval: 40  # Number of epochs for warmup phase
    cosine_min_factor: 0.01  # Minimum learning rate factor for cosine annealing

## HypHC parameters
hyphc:
  loss_weight: 1.0
  temperature: 0.01
  sampling_strategy: 'all_subsample_triplets' # 'all_subsample_triplets', 'chami', 'probabilistic_coverage'
  triplet_subsampling_size: 200
  triplet_subsampling_delta: 0.1 # The probability of missing a pair
  lca_version: 'ours' # 'ours', 'chami'
  normalized_loss: True
  distances_type: 'cosine_similarity' # 'geodesic', 'cosine_similarity'
  dist_sum_loss: True
  distances_version: 'lorentzian_proxy' # 'mobius_direct', 'lorentzian_proxy'

## Model architecture
architecture:
  ae_type: 'feedforward' # 'feedforward', 'convolutional', 'resnet18', 'resnet34', 'resnet50', 'poincare_resnet'
  hidden_dims: [512, 256, 64, 16]
  latent_dim: 10 # Hyperboloid automatically uses latent_dim + 1, i.e. latent_dim actually refers to the dimension of the hyperbolic manifold
  hyperbolic_encoding: 'HyperbolicLinearPP' # 'EuclideanLinear_Exp', 'HyperbolicLinear', 'HyperbolicLinearPP'
  hyperbolic_decoding: 'Log_EuclideanLinear' # 'Log_EuclideanLinear', 'HyperbolicLinear_Log', 'HyperbolicLinearPP_Log',
                                             # 'HyperbolicRegression', 'HyperbolicRegressionPP'
  precision: 'float32' # 'float32', 'float64'
  manifold_name: 'PoincareBall' # 'Euclidean', 'Hyperboloid', 'PoincareBall'
  manifold_precision: 'float32' # 'float32', 'float64'
  curvature_magnitude: 1.0
  activation_function: 'relu' #'relu', 'swish'
  hyperbolic_clamping: 1.0
  hyperbolic_smoothing: 50.0
  learnable_scale: False # only used if hyperbolic_encoding is 'HyperbolicLinearHyperboloidFHNN', 'HyperbolicLinearHyperboloidFHCNN'
  normalize: False # only used if hyperbolic_encoding is 'HyperbolicLinearHyperboloidFHCNN'
  spectral_norm: False # True, False

## Evaluation Metrics to be used and logged
evaluation:
  delta_hyperbolicity: False
  dendrogram_purity_single: False
  dendrogram_purity_complete: False
  dendrogram_purity_average: False
  dendrogram_purity_ward: False
  agglomerative_clustering_single: False
  agglomerative_clustering_complete: False
  agglomerative_clustering_average: False
  agglomerative_clustering_ward: False
  nearest_neighbors_accuracy: False
  spectral_clustering: True
  visualization: True
  kmeans: True
  visualization_sample_size: 5000

## Logging
wandb:
  enabled: True
  project: 'hyper_clustering'
  entity: 'kevin-sidak-team'
  save_dir: './logs'
  tags: []

## Hydra specifics
hydra:
  run:
    dir: ${wandb.save_dir}/hydra/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: ${wandb.save_dir}/hydra/${now:%Y-%m-%d_%H-%M-%S}
  output_subdir: null
  job:
    chdir: False

defaults:
  - _self_
  - dataset: ${oc.select:dataset,mnist}
