## iNaturalist 2018 unsupervised DINO pretraining + hyperbolic clustering
## 8,142 species with deep taxonomic hierarchy (kingdom > phylum > class > order > family > genus > species)

architecture:
  model_type: resnet50
  latent_dim: 128
  feature_scaling: True
  projection_layer_dims: [1024, 512]
  precision: float32
  manifold_precision: float64
  manifold_name: PoincareBall
  curvature_magnitude: 1.0
  hyperbolic_encoding: HyperbolicLinearPP
  activation_function: swish
  hyperbolic_clamping: 1.0
  hyperbolic_smoothing: 50.0
  hyperboloid_layer_learnable_scale: True
  FHCNN_normalize: True
  hyperbolic_decoding: Log_EuclideanLinear
  feedforward_hidden_dims: [512, 256, 128]

pretraining:
  method: dino
  augmentation: dino
  epochs: 100
  overwrite: False
  learning_rate: 5e-4
  weight_decay: 0.04
  accumulate_gradients: 4  # Effective batch = 256 * 4 = 1024
  enable_checkpointing: True
  load_supervised_weights: False
  supervised: False
  pretrained_weights_path: null  # Path to external checkpoint (e.g., FB DINO ResNet50)
  # Multi-crop settings
  n_local_crops: 6
  local_crop_size: 96
  # Contrastive loss on hyperbolic embeddings (alongside DINO loss)
  contrastive_loss:
    enabled: True
    weight: 0.5
    temperature: 0.2
  reconstruction_loss:
    weight: 0.0
  # LR scheduler
  lr_scheduler:
    type: warmup_cosine
    interval: 10
    cosine_min_factor: 0.001
    patience: 20
  # DINO-specific settings
  dino:
    out_dim: 65536
    hidden_dim: 2048
    bottleneck_dim: 256
    teacher_momentum_start: 0.996
    teacher_momentum_end: 1.0
    teacher_temperature: 0.04
    student_temperature: 0.1
    center_momentum: 0.9
    warmup_teacher_temp: 0.04
    warmup_teacher_temp_epochs: 30

clustering:
  epochs: 50
  learning_rate: 1e-4
  weight_decay: 1e-5
  enable_checkpointing: False
  accumulate_gradients: 4
  freeze_encoder: True
  lr_scheduler:
    type: warmup_cosine
    interval: 10
    cosine_min_factor: 0.01
    patience: 20
  hyperbolic_loss:
    start_weight: 1.0
    end_weight: 5.0
    weight_interval: 30
    start_temperature: 0.2
    end_temperature: 0.1
    temperature_interval: 30
    lca_version: ours
    loss_version: normalized
    sampling_strategy: importance
    sampling_eps: 0.01
    sampling_delta: 0.01
    sampling_alpha: 0.2
    uniform_sample_size: 10000
    log_approximation_diff: False
    use_backbone_knn_similarities: True
    snn_k: 10
    similarity_pruning:
      version: null
      threshold: 0.01
      quantile: 0.2
      nearest_neighbors: 10
  contrastive_loss:
    enabled: True
    temperature: 0.5
    weight: 0.1
  reconstruction_loss:
    weight: 0.0
  regularizer:
    enabled: False
    weight: 0.05

experiment:
  seed: 42
  num_workers: 16
  batch_size: 256
  log_interval: 10
  optimizer: Adam
  gradient_clip_value: 5.0

evaluation_metrics:
  delta_hyperbolicity: False
  dendrogram_purity_single: False
  dendrogram_purity_complete: True
  dendrogram_purity_average: False
  dendrogram_purity_ward: True
  dendrogrampurity_use_root: True
  agglomerative_clustering_single: False
  agglomerative_clustering_complete: True
  agglomerative_clustering_average: False
  agglomerative_clustering_ward: True
  nearest_neighbors_accuracy: True
  spectral_clustering: False
  visualization: True
  kmeans: False
  dasgupta_cost: False
  visualization_sample_size: 5000
  test_sample_size: 10000
  use_wordnet_labels: True   # iNat uses its own taxonomy file, not WordNet, but the eval branch is gated on this flag
  wordnet_hierarchy_path: './data/cifar100_wordnet_hierarchy.txt'
  imagenet_hierarchy_path: './data/imagenet_wordnet_hierarchy.txt'
  inat18_hierarchy_path: './data/inat18_taxonomy_hierarchy.txt'
  wordnet_download_if_missing: False

wandb:
  enabled: True
  project: hyper_clustering
  entity: kevin-sidak-team
  save_dir: ./logs
  tags:
    - inat18
    - dino
    - unsupervised

hydra:
  run:
    dir: ${wandb.save_dir}/hydra/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: ${wandb.save_dir}/hydra/${now:%Y-%m-%d_%H-%M-%S}
  output_subdir: null
  job:
    chdir: False

defaults:
  - _self_
  - dataset: inat18
  - override hydra/job_logging: disabled
