architecture:
  latent_dim: 32
  cluster_dim: 32
  ae_type: resnet50
  curvature_magnitude: 1.0
  spectral_normalization: false
  activation_function: swish
  manifold_name: PoincareBall
  hyperbolic_encoding: HyperbolicLinearPP
  manifold_precision: float64
  precision: float32
  use_seperate_heads: false

pretraining:
  epochs: 800
  overwrite: false
  recon_weight: 0.0
  weight_decay: 1e-5
  trainable_curvature: false
  learning_rate: 0.003
  contrastive_loss:
    temperature: 0.5
    enabled: true
    byol: false

clustering:
  epochs: 400
  learning_rate: 1e-4
  weight_decay: 1e-5
  freeze_encoder: false
  contrastive_loss:
    enabled: False
    weight: 0.1

hyphc:
  max_loss_weight: 1.0
  min_loss_weight: 1.0
  loss_weight_interval: 200
  normalized_loss: true
  dist_sum_loss: true
  triplet_subsampling_size: 500
  sampling_strategy: random_with_replace
  fine_triplet_ratio: 0.5
  lca_version: wang
  triplet_margin: 1.0
  hierarchy_weight: 0.0
  hierarchy_margin: 0.1
  distances_type: geodesic
  gt_alpha: 0.7
  gt_similarity_mode: none
  similarity_pruning_threshold: 0.1

experiment:
  gradient_clip_value: 5.0
  optimizer: Adam
  num_workers: 16
  batch_size: 512
  log_interval: 10
  seed: 1

wandb:
  tags:
    - imagenet
    - poincare
    - sweep

evaluation:
  use_wordnet_labels: true

defaults:
 - config
