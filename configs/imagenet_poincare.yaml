# ---------------------------------------------------------------------------------------------------------------
# CLEAN-UP NOTE (2026-10-01) -- observations from the release clean-up; this file itself was left untouched.
#
# * Written against a much older config schema. It inherits from config.yaml (`defaults: - config`), so it still composes,
#   but most of its keys do not exist in config.yaml anymore and are merged as extra keys that no code reads:
#       the whole `hyphc:` and `evaluation:` sections (now clustering.hierarchical_loss / evaluation_metrics),
#       architecture.cluster_dim, ae_type, spectral_normalization, use_seperate_heads
#           (they still enter the pretraining-cache hash, which covers the whole architecture block),
#       pretraining.recon_weight, trainable_curvature, contrastive_loss.enabled, contrastive_loss.byol.
#   Everything about the hierarchical loss therefore comes from config.yaml, not from this file.
# * Despite its name it does not select the ImageNet dataset (the dataset default of config.yaml, cifar100, applies).
# * Used once in the historical slurm scripts (old_slurm/ in git history). Not connected to the paper runs, which used
#   imagenet_dino.yaml as base -> candidate for deletion.
# ---------------------------------------------------------------------------------------------------------------

architecture:
  latent_dim: 32
  cluster_dim: 32
  ae_type: resnet50
  curvature_magnitude: 1.0
  spectral_normalization: false
  activation_function: swish
  manifold_name: PoincareBall
  hyperbolic_encoding: HyperbolicLinearPP
  manifold_precision: float64
  precision: float32
  use_seperate_heads: false

pretraining:
  epochs: 800
  overwrite: false
  recon_weight: 0.0
  weight_decay: 1e-5
  trainable_curvature: false
  learning_rate: 0.003
  contrastive_loss:
    temperature: 0.5
    enabled: true
    byol: false

clustering:
  epochs: 400
  learning_rate: 1e-4
  weight_decay: 1e-5
  freeze_encoder: false
  contrastive_loss:
    enabled: False
    weight: 0.1

hyphc:
  max_loss_weight: 1.0
  min_loss_weight: 1.0
  loss_weight_interval: 200
  normalized_loss: true
  dist_sum_loss: true
  triplet_subsampling_size: 500
  sampling_strategy: random_with_replace
  fine_triplet_ratio: 0.5
  lca_version: wang
  triplet_margin: 1.0
  hierarchy_weight: 0.0
  hierarchy_margin: 0.1
  distances_type: geodesic
  gt_alpha: 0.7
  gt_similarity_mode: none
  similarity_pruning_threshold: 0.1

experiment:
  gradient_clip_value: 5.0
  optimizer: Adam
  num_workers: 16
  batch_size: 512
  log_interval: 10
  seed: 1

wandb:
  tags:
    - imagenet
    - poincare
    - sweep

evaluation:
  use_wordnet_labels: true

defaults:
 - config
