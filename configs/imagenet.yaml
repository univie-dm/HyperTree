# ImageNet-1k recipe of the paper (Appendix, table "Hyperparameters for all main-paper experiments"): the public
# DINO ResNet-50 (downloaded to paths.models_dir on first use) as a frozen backbone, no pretraining stage, 50 epochs
# of joint training of the projection head, feature scaling and hyperbolic layer.
#
#   python train.py --config-name imagenet experiment.seed=<seed>      (the paper reports seeds 1, 2, 3)
#   Hyperboloid rows of the main tables: architecture.manifold_name=Hyperboloid
#
# The metrics are computed on a class-stratified 10,000-image subsample of the validation split.
# Only the dataset-specific values are set here; everything else comes from config.yaml.

defaults:
  - config
  - override dataset: imagenet
  - _self_

experiment:
  batch_size: 256

pretraining:
  epochs: 0
  enable_checkpointing: False
  pretrained_weights: https://dl.fbaipublicfiles.com/dino/dino_resnet50_pretrain/dino_resnet50_pretrain.pth

architecture:
  model_type: 'resnet50'
  projection_layer_dims: [1024, 512, 256]
  latent_dim: 32

clustering:
  epochs: 50
  freeze_encoder: True
  hierarchical_loss:
    weight_interval: 50
    temperature_interval: 50

evaluation_metrics:
  test_sample_size: 10000

wandb:
  tags:
    - imagenet
