[project]
name = "hypertree"
version = "1.0.0"
description = "scalable unsupervised hierarchy discovery in hyperbolic space"
readme = "README.md"
license = "MIT"
requires-python = "==3.11.*"  # the paper results were produced with Python 3.11
# Exact versions of the environment that produced the paper results
dependencies = [
    "hydra-core==1.3.2",
    "numpy==2.4.2",
    "omegaconf==2.3.0",
    "pillow==12.1.0",
    "pytorch-lightning==2.6.1",
    "requests==2.32.5",
    "scikit-learn==1.8.0",
    "scipy==1.17.0",
    "threadpoolctl==3.6.0",
    "torch==2.10.0",
    "torchvision==0.25.0",
    "wandb==0.24.1",
]

[project.optional-dependencies]
# BioCLIP backbone of the iNaturalist-2018 recipe (architecture.model_type=bioclip)
bioclip = ["open_clip_torch==3.3.0"]
